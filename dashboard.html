<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Microsoft Clarity · INGESCO</title>
<link rel="icon" type="image/png" href="assets/logo-ingesco.png">
<style>
  :root{
    /* Paleta corporativa INGESCO */
    --navy:#13294b; --azul:#1f5f9b; --cielo:#34a0d9; --azul-osc:#13294b;
    --verde:#1f9d6b; --naranja:#e08a2b; --gris:#9aa3b2;
    --rojo:#d64545; --ambar:#d99a2b;
    --fondo:#f4f6f9; --tarjeta:#ffffff; --texto:#13294b; --suave:#6b7688;
    --borde:#e3e8ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--fondo);color:var(--texto);padding:32px 24px 64px;
  }
  .contenedor{max-width:1180px;margin:0 auto}

  /* Cabecera */
  header{display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:16px;margin-bottom:28px;
    border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:52px;width:auto}
  .titulo .sep{width:1px;height:46px;background:var(--borde)}
  .titulo h1{font-size:23px;font-weight:800;letter-spacing:-.5px;color:var(--navy);line-height:1.15}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:13px;color:var(--suave)}
  .meta .periodo{display:inline-block;background:var(--navy);color:#fff;
    padding:4px 12px;border-radius:999px;font-weight:600;font-size:12px;margin-bottom:6px}
  .btn-ia{display:inline-block;background:linear-gradient(135deg,var(--azul),var(--cielo));color:#fff;
    padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;margin-bottom:8px;
    box-shadow:0 2px 8px rgba(31,95,155,.25)}
  .btn-ia:hover{filter:brightness(1.07)}

  /* Secciones */
  h2.seccion{font-size:14px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--suave);margin:34px 0 14px;font-weight:700}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;
    padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .valor{font-size:32px;font-weight:700;margin-top:8px;letter-spacing:-1px}
  .kpi .sub{font-size:12px;color:var(--suave);margin-top:4px}

  /* Rejilla 2 columnas */
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:780px){.rejilla{grid-template-columns:1fr}}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;
    padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h3{font-size:16px;margin-bottom:18px;font-weight:700}

  /* Donut dispositivos */
  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .leyenda{list-style:none;font-size:14px}
  .leyenda li{display:flex;align-items:center;gap:10px;margin:8px 0}
  .punto{width:12px;height:12px;border-radius:3px;display:inline-block}
  .leyenda .n{font-weight:700;margin-left:auto;padding-left:18px}
  .leyenda .pct{color:var(--suave);font-size:12px;width:46px;text-align:right}

  /* Barras engagement */
  .barra-fila{margin:14px 0}
  .barra-fila .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .barra-fila .top b{font-weight:700}
  .pista{background:#eef2f7;border-radius:8px;height:12px;overflow:hidden}
  .relleno{height:100%;border-radius:8px}

  /* Señales UX */
  .senales{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .senal{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:18px;
    border-left:5px solid var(--gris)}
  .senal.ok{border-left-color:var(--verde)}
  .senal.aviso{border-left-color:var(--ambar)}
  .senal.alerta{border-left-color:var(--rojo)}
  .senal .etq{font-size:13px;color:var(--suave);font-weight:600}
  .senal .valor{font-size:26px;font-weight:700;margin-top:6px}
  .senal .desc{font-size:11px;color:var(--suave);margin-top:6px;line-height:1.4}

  /* Historico */
  .hist-nota{font-size:13px;color:var(--suave);margin-top:10px}

  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
  .aviso-vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    padding:24px;border-radius:14px;font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>Dashboard de Experiencia Web</h1>
        <p>Microsoft Clarity · comportamiento real de los visitantes</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-ia" href="index.html" style="background:var(--navy);box-shadow:none">🏠 Inicio</a>
      <a class="btn-ia" href="visibilidad-ia.html">🤖 Visibilidad en IA →</a><br>
      <div class="periodo" id="periodo">Últimos 3 días</div><br>
      <span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer>
    <b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 ·
    Datos de Microsoft Clarity
  </footer>
</div>

<!-- Datos generados por el script de PowerShell -->
<script src="datos/datos.js"></script>
<script src="datos/historico.js"></script>
<script>
(function(){
  const cont = document.getElementById('contenido');

  if(typeof window.CLARITY === 'undefined'){
    cont.innerHTML = '<div class="aviso-vacio">⚠️ <b>Aún no hay datos.</b><br>' +
      'Ejecuta el script <b>«Actualizar datos»</b> (carpeta del proyecto) y vuelve a abrir esta página.</div>';
    return;
  }

  const C = window.CLARITY;
  document.getElementById('actualizado').textContent = 'Actualizado: ' + C.fechaActualizacion;
  document.getElementById('periodo').textContent = 'Últimos ' + C.dias + ' días';

  // --- Helpers ---
  const num = n => Number(n||0).toLocaleString('es-ES');
  const metric = name => {
    const m = (C.datos||[]).find(x => x.metricName === name);
    return m ? m.information : [];
  };
  const colorDisp = d => ({'PC':'var(--azul)','Mobile':'var(--verde)','Tablet':'var(--naranja)','Other':'var(--gris)'}[d]||'var(--gris)');
  const nombreDisp = d => ({'PC':'Ordenador','Mobile':'Móvil','Tablet':'Tablet','Other':'Otros'}[d]||d);

  // --- TRÁFICO ---
  const traffic = metric('Traffic');
  let sesiones=0, usuarios=0, bots=0, ppsNum=0;
  const porDisp = {};
  traffic.forEach(t=>{
    const s = parseInt(t.totalSessionCount)||0;
    sesiones += s;
    usuarios += parseInt(t.distinctUserCount)||0;
    bots     += parseInt(t.totalBotSessionCount)||0;
    ppsNum   += s * (parseFloat(t.pagesPerSessionPercentage)||0);
    porDisp[t.Device] = (porDisp[t.Device]||0) + s;
  });
  const pps = sesiones ? (ppsNum/sesiones) : 0;

  // mapa device -> sesiones reales (para ponderar medias)
  const sesDe = d => porDisp[d]||0;

  // --- SCROLL medio ponderado ---
  let scrollNum=0, scrollDen=0;
  metric('ScrollDepth').forEach(x=>{ const s=sesDe(x.Device); scrollNum+=s*(parseFloat(x.averageScrollDepth)||0); scrollDen+=s; });
  const scroll = scrollDen ? scrollNum/scrollDen : 0;

  // --- ENGAGEMENT (tiempo activo medio, ponderado) ---
  let actNum=0, actDen=0, engPorDisp=[];
  metric('EngagementTime').forEach(x=>{
    const s=sesDe(x.Device);
    const act=parseFloat(x.activeTime)||0;
    actNum+=s*act; actDen+=s;
    engPorDisp.push({d:x.Device, activo:act, total:parseFloat(x.totalTime)||0, s:s});
  });
  const activo = actDen ? actNum/actDen : 0;
  const fmtTiempo = seg => { seg=Math.round(seg); const m=Math.floor(seg/60), s=seg%60; return m>0? (m+'m '+s+'s') : (s+'s'); };

  // --- SEÑALES UX (% de sesiones con la métrica, ponderado) ---
  function pctMetrica(name){
    let con=0, tot=0;
    metric(name).forEach(x=>{
      const s=parseInt(x.sessionsCount)||0;
      const p=parseFloat(x.sessionsWithMetricPercentage)||0;
      con += s*p/100; tot += s;
    });
    return tot ? (con/tot*100) : 0;
  }
  const deadPct  = pctMetrica('DeadClickCount');
  const ragePct  = pctMetrica('RageClickCount');
  const errPct   = pctMetrica('ScriptErrorCount');
  const quickPct = pctMetrica('QuickbackClick');

  const nivel = (v,aviso,alerta) => v>=alerta?'alerta':(v>=aviso?'aviso':'ok');

  // ================= RENDER =================
  let html = '';

  // KPIs
  html += '<div class="kpis">';
  html += kpi('👥','Sesiones reales', num(sesiones), bots+' bots descartados');
  html += kpi('🧑‍💼','Usuarios únicos', num(usuarios), 'visitantes distintos');
  html += kpi('📄','Páginas por sesión', pps.toFixed(2).replace('.',','), 'navegación media');
  html += kpi('⏱️','Tiempo activo medio', fmtTiempo(activo), 'interacción real por sesión');
  html += kpi('📜','Scroll medio', Math.round(scroll)+'%', 'cuánto bajan en la página');
  html += '</div>';

  // Dispositivos + Engagement
  html += '<h2 class="seccion">Cómo nos visitan</h2><div class="rejilla">';
  html += panelDispositivos();
  html += panelEngagement();
  html += '</div>';

  // Señales UX
  html += '<h2 class="seccion">Señales de experiencia de usuario</h2>';
  html += '<div class="senales">';
  html += senal('🖱️','Clics muertos', deadPct, 'Clics en algo que no responde. Posibles elementos que parecen botones y no lo son.', nivel(deadPct,10,20));
  html += senal('😤','Clics de frustración', ragePct, 'Clics repetidos y rápidos: señal de algo que no funciona como esperan.', nivel(ragePct,2,5));
  html += senal('⚠️','Errores de script', errPct, 'Sesiones donde la web lanzó un error técnico de JavaScript.', nivel(errPct,5,10));
  html += senal('↩️','Vuelta rápida atrás', quickPct, 'Entran a una página y vuelven enseguida: contenido que no encaja con lo que buscaban.', nivel(quickPct,5,10));
  html += '</div>';

  // Histórico
  html += '<h2 class="seccion">Evolución</h2>';
  html += panelHistorico();

  cont.innerHTML = html;

  // ---------- componentes ----------
  function kpi(ic,etq,val,sub){
    return '<div class="kpi"><div class="etq">'+ic+' '+etq+'</div>'+
      '<div class="valor">'+val+'</div><div class="sub">'+sub+'</div></div>';
  }

  function panelDispositivos(){
    const total = Object.values(porDisp).reduce((a,b)=>a+b,0) || 1;
    const orden = Object.keys(porDisp).sort((a,b)=>porDisp[b]-porDisp[a]);
    // donut con SVG (stroke-dasharray)
    const R=70, C2=2*Math.PI*R; let offset=0;
    let circles='';
    orden.forEach(d=>{
      const frac=porDisp[d]/total;
      const len=frac*C2;
      circles+='<circle r="'+R+'" cx="90" cy="90" fill="transparent" stroke="'+colorDisp(d)+'" '+
        'stroke-width="26" stroke-dasharray="'+len+' '+(C2-len)+'" stroke-dashoffset="'+(-offset)+'" '+
        'transform="rotate(-90 90 90)"></circle>';
      offset+=len;
    });
    let leyenda='<ul class="leyenda">';
    orden.forEach(d=>{
      const pct=Math.round(porDisp[d]/total*100);
      leyenda+='<li><span class="punto" style="background:'+colorDisp(d)+'"></span>'+
        nombreDisp(d)+'<span class="n">'+num(porDisp[d])+'</span>'+
        '<span class="pct">'+pct+'%</span></li>';
    });
    leyenda+='</ul>';
    return '<div class="panel"><h3>Sesiones por dispositivo</h3><div class="donut-wrap">'+
      '<svg width="180" height="180" viewBox="0 0 180 180">'+circles+
      '<text x="90" y="84" text-anchor="middle" font-size="15" fill="#64748b">Total</text>'+
      '<text x="90" y="106" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">'+num(total)+'</text>'+
      '</svg>'+leyenda+'</div></div>';
  }

  function panelEngagement(){
    const maxT = Math.max(...engPorDisp.map(e=>e.total),1);
    const orden = engPorDisp.filter(e=>e.s>0).sort((a,b)=>b.s-a.s);
    let filas='';
    orden.forEach(e=>{
      const w=Math.round(e.activo/maxT*100);
      const wt=Math.round(e.total/maxT*100);
      filas+='<div class="barra-fila"><div class="top"><span>'+nombreDisp(e.d)+'</span>'+
        '<span><b>'+fmtTiempo(e.activo)+'</b> activo · '+fmtTiempo(e.total)+' total</span></div>'+
        '<div class="pista"><div class="relleno" style="width:'+Math.max(wt,3)+'%;background:#e2e8f0;position:relative">'+
        '<div class="relleno" style="width:'+(wt?Math.round(w/wt*100):0)+'%;background:'+colorDisp(e.d)+'"></div></div></div></div>';
    });
    return '<div class="panel"><h3>Tiempo por sesión y dispositivo</h3>'+filas+
      '<div class="hist-nota">Barra de color = tiempo <b>activo</b> (interacción real) sobre el tiempo total en la página.</div></div>';
  }

  function senal(ic,etq,val,desc,clase){
    return '<div class="senal '+clase+'"><div class="etq">'+ic+' '+etq+'</div>'+
      '<div class="valor">'+val.toFixed(1).replace('.',',')+'%</div>'+
      '<div class="desc">'+desc+'</div></div>';
  }

  function panelHistorico(){
    const H = (window.CLARITY_HISTORICO||[]);
    if(H.length < 2){
      return '<div class="panel"><h3>Evolución de sesiones</h3>'+
        '<div class="hist-nota">📈 Aquí aparecerá la <b>tendencia día a día</b> en cuanto el dashboard lleve unos días recogiendo datos. '+
        'De momento hay '+H.length+' registro'+(H.length===1?'':'s')+'. '+
        'Cuando programemos la actualización diaria automática (Paso 4), esta gráfica se irá rellenando sola.</div></div>';
    }
    // gráfica de líneas SVG
    const W=1080, Hg=220, pad=40;
    const xs=H.map((d,i)=>pad+i*(W-2*pad)/(H.length-1));
    const maxV=Math.max(...H.map(d=>d.sesiones))*1.15||1;
    const ys=H.map(d=>Hg-pad-(d.sesiones/maxV)*(Hg-2*pad));
    let pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
    let dots=xs.map((x,i)=>'<circle cx="'+x+'" cy="'+ys[i]+'" r="4" fill="var(--azul)"></circle>'+
      '<text x="'+x+'" y="'+(ys[i]-12)+'" text-anchor="middle" font-size="12" fill="#0f172a">'+num(H[i].sesiones)+'</text>'+
      '<text x="'+x+'" y="'+(Hg-pad+20)+'" text-anchor="middle" font-size="11" fill="#64748b">'+H[i].fecha.slice(5)+'</text>').join('');
    return '<div class="panel"><h3>Evolución de sesiones reales</h3>'+
      '<svg width="100%" viewBox="0 0 '+W+' '+Hg+'">'+
      '<polyline points="'+pts+'" fill="none" stroke="var(--azul)" stroke-width="2.5"></polyline>'+dots+'</svg></div>';
  }

})();
</script>
</body>
</html>
