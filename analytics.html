<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visibilidad en Web · Google Analytics · INGESCO</title>
<link rel="icon" type="image/png" href="assets/favicon.ico.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
<style>
  :root{--navy:#13294b;--azul:#1f5f9b;--cielo:#34a0d9;--fondo:#f4f6f9;
    --tarjeta:#fff;--texto:#13294b;--suave:#6b7688;--borde:#e3e8ef;
    --verde:#16a34a;--rojo:#dc2626;--naranja:#e08a2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);padding:32px 24px 64px}
  .contenedor{max-width:1120px;margin:0 auto}
  a{text-decoration:none}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:26px;border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:50px;width:auto}
  .titulo .sep{width:1px;height:44px;background:var(--borde)}
  .titulo h1{font-size:22px;font-weight:800;color:var(--navy)}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:12px;color:var(--suave)}
  .btn-inicio{background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;margin-bottom:8px}
  .btn-inicio:hover{filter:brightness(1.15)}
  h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:32px 0 14px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600}
  .kpi .valor{font-size:30px;font-weight:800;margin-top:8px;color:var(--navy)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:6px}
  .kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)} .kpi .delta.flat{color:var(--suave)}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.rejilla{grid-template-columns:1fr}}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h3{font-size:16px;margin-bottom:16px}
  .barra{margin:11px 0}
  .barra .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .barra .top b{font-weight:700}
  .pista{background:#eef2f7;border-radius:7px;height:11px;overflow:hidden}
  .relleno{height:100%;border-radius:7px}
  /* Mapa */
  .mapa-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px}
  @media(max-width:880px){.mapa-wrap{grid-template-columns:1fr}}
  #mapa{width:100%;height:430px}
  .leyenda-mapa{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--suave)}
  .leyenda-barra{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,#d6e9ff,#2563eb)}
  .pais-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:9px 0}
  .pais-row .ban{font-size:18px;width:24px;text-align:center}
  .pais-row .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pais-row .val{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  /* Páginas (enlaces) */
  .pag{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--borde)}
  .pag:hover{background:#f8fafc}
  .pag .rank{font-weight:800;color:var(--cielo);width:22px;text-align:center}
  .pag .cuerpo{flex:1;min-width:0}
  .pag .tit{font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .pag .url{font-size:11.5px;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .pag .vis{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
  .pag .ir{color:var(--cielo);font-size:14px}
  .vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:24px;border-radius:14px}
  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
  .jvm-tooltip{background:#13294b;font-weight:600}
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>📊 Visibilidad en Web</h1>
        <p>Google Analytics · tráfico de la web</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-inicio" href="index.html">← Inicio</a><br>
      <span id="periodo">—</span><br><span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer><b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 · Fuente: Google Analytics (GA4)</footer>
</div>

<script src="datos/ga.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script>
(function(){
  const cont = document.getElementById('contenido');
  if(typeof window.GA === 'undefined'){
    cont.innerHTML = '<div class="vacio">⚠️ <b>Aún no hay datos.</b> Ejecuta «Actualizar datos» y recarga.</div>';
    return;
  }
  const G = window.GA;
  const num = n => Number(n||0).toLocaleString('es-ES');
  const colores = ['#1f5f9b','#34a0d9','#13294b','#e08a2b','#16a34a','#9333ea','#dc2626','#0891b2'];
  document.getElementById('periodo').textContent = 'Periodo: ' + G.periodo.ini + ' – ' + G.periodo.fin;
  document.getElementById('actualizado').textContent = 'Actualizado: ' + G.fechaActualizacion;

  const t = G.totales;
  function delta(cur,prev){
    if(!prev) return '<div class="delta flat">—</div>';
    const d=(cur-prev)/prev*100, cls=d>=0?'up':'down', fl=d>=0?'▲':'▼';
    return '<div class="delta '+cls+'">'+fl+' '+Math.abs(d).toFixed(1).replace('.',',')+'% vs. periodo anterior</div>';
  }
  const fmtDur = s => { s=Math.round(s); const m=Math.floor(s/60), x=s%60; return m>0?(m+'m '+x+'s'):(x+'s'); };
  const bandera = code => { if(!code||code.length!==2) return '🌐'; return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))); };

  let html='<div class="kpis">';
  html+='<div class="kpi"><div class="etq">🧑‍💼 Usuarios</div><div class="valor">'+num(t.usuarios)+'</div>'+delta(t.usuarios,t.usuariosPrev)+'</div>';
  html+='<div class="kpi"><div class="etq">🔁 Sesiones</div><div class="valor">'+num(t.sesiones)+'</div>'+delta(t.sesiones,t.sesionesPrev)+'</div>';
  html+='<div class="kpi"><div class="etq">📄 Páginas vistas</div><div class="valor">'+num(t.vistas)+'</div><div class="delta flat">en el periodo</div></div>';
  html+='<div class="kpi"><div class="etq">⏱️ Duración media</div><div class="valor">'+fmtDur(t.duracion)+'</div><div class="delta flat">por sesión</div></div>';
  html+='</div>';

  html+='<h2 class="seccion">Evolución diaria</h2><div class="panel">'+grafico(G.porDia)+'</div>';

  // Mapa de países
  const paises = (G.paises||[]).slice().sort((a,b)=>b.valor-a.valor);
  html+='<h2 class="seccion">De dónde nos visitan</h2>';
  html+='<div class="panel"><div class="mapa-wrap"><div>'+
        '<div id="mapa"></div>'+
        '<div class="leyenda-mapa"><span>Menos visitas</span><div class="leyenda-barra"></div><span>Más visitas</span></div></div>'+
        '<div><h3 style="font-size:15px;margin-bottom:8px">Top países</h3>'+listaPaises(paises.slice(0,12))+'</div>'+
        '</div></div>';

  html+='<h2 class="seccion">De dónde viene el tráfico</h2><div class="rejilla">';
  html+=barras('Canales de adquisición', G.canales, 'sesiones');
  html+=barras('Dispositivos', G.dispositivos, 'sesiones');
  html+='</div>';

  html+='<h2 class="seccion">Páginas más visitadas</h2>';
  html+=paginasLinks(G.paginas||[]);

  cont.innerHTML = html;

  // ---- Pintar el mapa: calculamos NOSOTROS el color de cada país ----
  const valores={};
  paises.forEach(p=>{ if(p.code){ valores[p.code]=p.valor; } });
  const maxV = Math.max(...Object.values(valores), 1);
  const C0=[214,233,255], C1=[37,99,235]; // #d6e9ff (claro) -> #2563eb (azul)
  function colorFor(v){
    const t=Math.min(1, Math.sqrt(v)/Math.sqrt(maxV));   // raíz: que los pequeños también se vean
    const r=Math.round(C0[0]+(C1[0]-C0[0])*t), g=Math.round(C0[1]+(C1[1]-C0[1])*t), b=Math.round(C0[2]+(C1[2]-C0[2])*t);
    return 'rgb('+r+','+g+','+b+')';
  }
  function fallback(msg){ const m=document.getElementById('mapa'); if(m) m.innerHTML='<div style="padding:30px;color:var(--suave);text-align:center">🌐 '+msg+' Consulta el «Top países».</div>'; }
  try{
    if(window.jsVectorMap){
      new window.jsVectorMap({
        selector:'#mapa', map:'world', zoomButtons:true, zoomOnScroll:false, backgroundColor:'transparent',
        regionStyle:{ initial:{ fill:'#eef2f7', stroke:'#ffffff', strokeWidth:0.5 }, hover:{ fillOpacity:0.85 } },
        onRegionTooltipShow(event, tooltip, code){
          const v = valores[code];
          tooltip.text(tooltip.text() + (v!=null ? (' · '+num(v)+' usuarios') : ' · sin visitas'), true);
        }
      });
      // Coloreamos cada país directamente sobre su <path>
      setTimeout(function(){
        const paths=document.querySelectorAll('#mapa path');
        let pintados=0;
        paths.forEach(function(p){
          const code=(p.getAttribute('data-code')||p.id||'').toUpperCase();
          if(code && valores[code]!=null){ p.style.fill=colorFor(valores[code]); pintados++; }
        });
        if(pintados===0) fallback('No se pudieron colorear los países.');
      }, 80);
    } else { fallback('Mapa no disponible (sin conexión).'); }
  }catch(e){ fallback('No se pudo dibujar el mapa.'); }

  // ---------- componentes ----------
  function listaPaises(arr){
    let h='';
    arr.forEach(p=>{ h+='<div class="pais-row"><span class="ban">'+bandera(p.code)+'</span><span class="nom">'+p.nombre+'</span><span class="val">'+num(p.valor)+'</span></div>'; });
    return h;
  }
  function paginasLinks(filas){
    const base='https://www.ingesco.com';
    let h='<div class="panel">';
    filas.forEach((f,i)=>{
      const url = base + (f.path||'');
      h+='<a class="pag" href="'+url+'" target="_blank" rel="noopener">'+
         '<span class="rank">'+(i+1)+'</span>'+
         '<span class="cuerpo"><span class="tit">'+(f.titulo||f.path)+'</span><span class="url">'+url+'</span></span>'+
         '<span class="vis">'+num(f.valor)+'</span><span class="ir">↗</span></a>';
    });
    return h+'</div>';
  }
  function barras(titulo, filas, unidad){
    const max=Math.max(...(filas||[]).map(f=>f.valor),1);
    let h='<div class="panel"><h3>'+titulo+'</h3>';
    (filas||[]).forEach((f,i)=>{ const w=Math.round(f.valor/max*100);
      h+='<div class="barra"><div class="top"><span>'+f.nombre+'</span><b>'+num(f.valor)+'</b></div><div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:'+colores[i%colores.length]+'"></div></div></div>'; });
    return h+'</div>';
  }
  function grafico(dias){
    if(!dias||dias.length<2) return '<p style="color:var(--suave)">Sin datos suficientes.</p>';
    const W=1060,H=240,pad=44;
    const xs=dias.map((d,i)=>pad+i*(W-2*pad)/(dias.length-1));
    const maxV=Math.max(...dias.map(d=>d.sesiones))*1.15||1;
    const ys=dias.map(d=>H-pad-(d.sesiones/maxV)*(H-2*pad));
    const pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
    const area=pts+' '+xs[xs.length-1]+','+(H-pad)+' '+xs[0]+','+(H-pad);
    const idxs=[0,Math.floor(dias.length/2),dias.length-1];
    const labels=idxs.map(i=>'<text x="'+xs[i]+'" y="'+(H-pad+20)+'" text-anchor="middle" font-size="11" fill="#6b7688">'+dias[i].fecha.slice(5)+'</text>').join('');
    return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1f5f9b" stop-opacity="0.30"/><stop offset="100%" stop-color="#1f5f9b" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+area+'" fill="url(#g)"></polygon>'+
      '<polyline points="'+pts+'" fill="none" stroke="#1f5f9b" stroke-width="2.5"></polyline>'+labels+
      '<text x="'+pad+'" y="22" font-size="12" fill="#13294b" font-weight="700">Sesiones por día</text></svg>';
  }
})();
</script>
<script src="assets/widget.js"></script>
</body>
</html>
