<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visibilidad en Google · Search Console · INGESCO</title>
<link rel="icon" type="image/png" href="assets/logo-ingesco.png">
<style>
  :root{--navy:#13294b;--azul:#1f5f9b;--cielo:#34a0d9;--fondo:#f4f6f9;
    --tarjeta:#fff;--texto:#13294b;--suave:#6b7688;--borde:#e3e8ef;
    --verde:#16a34a;--rojo:#dc2626}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);
    color:var(--texto);padding:32px 24px 64px}
  .contenedor{max-width:1120px;margin:0 auto}
  a{text-decoration:none}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
    margin-bottom:26px;border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:50px;width:auto}
  .titulo .sep{width:1px;height:44px;background:var(--borde)}
  .titulo h1{font-size:22px;font-weight:800;color:var(--navy)}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:12px;color:var(--suave)}
  .btn-inicio{background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;margin-bottom:8px}
  .btn-inicio:hover{filter:brightness(1.15)}
  h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:32px 0 14px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600}
  .kpi .valor{font-size:30px;font-weight:800;margin-top:8px;color:var(--navy)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:6px}
  .kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)} .kpi .delta.flat{color:var(--suave)}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--borde)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.clave{font-weight:600;color:var(--navy);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.rejilla{grid-template-columns:1fr}}
  .vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:24px;border-radius:14px}
  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>🔍 Visibilidad en Google</h1>
        <p>Search Console · presencia en el buscador</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-inicio" href="index.html">← Inicio</a><br>
      <span id="periodo">—</span><br><span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer><b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 · Fuente: Google Search Console</footer>
</div>

<script src="datos/gsc.js"></script>
<script>
(function(){
  const cont = document.getElementById('contenido');
  if(typeof window.GSC === 'undefined'){
    cont.innerHTML = '<div class="vacio">⚠️ <b>Aún no hay datos.</b> Ejecuta «Actualizar datos» y recarga.</div>';
    return;
  }
  const G = window.GSC;
  const num = n => Number(n||0).toLocaleString('es-ES');
  document.getElementById('periodo').textContent = 'Periodo: ' + G.periodo.ini + ' – ' + G.periodo.fin;
  document.getElementById('actualizado').textContent = 'Actualizado: ' + G.fechaActualizacion;

  const t = G.totales;
  function delta(cur,prev){
    if(!prev) return '<div class="delta flat">—</div>';
    const d = (cur-prev)/prev*100;
    const cls = d>=0?'up':'down';
    const fl = d>=0?'▲':'▼';
    return '<div class="delta '+cls+'">'+fl+' '+Math.abs(d).toFixed(1).replace('.',',')+'% vs. periodo anterior</div>';
  }

  let html = '<div class="kpis">';
  html += '<div class="kpi"><div class="etq">🖱️ Clics</div><div class="valor">'+num(t.clicks)+'</div>'+delta(t.clicks,t.clicksPrev)+'</div>';
  html += '<div class="kpi"><div class="etq">👁️ Impresiones</div><div class="valor">'+num(t.impressions)+'</div>'+delta(t.impressions,t.impressionsPrev)+'</div>';
  html += '<div class="kpi"><div class="etq">📊 CTR medio</div><div class="valor">'+String(t.ctr).replace('.',',')+'%</div><div class="delta flat">clics ÷ impresiones</div></div>';
  html += '<div class="kpi"><div class="etq">📍 Posición media</div><div class="valor">'+String(t.position).replace('.',',')+'</div><div class="delta flat">más baja = mejor</div></div>';
  html += '</div>';

  // Evolución diaria de clics
  html += '<h2 class="seccion">Evolución diaria</h2><div class="panel">'+grafico(G.porDia)+'</div>';

  // Tablas
  html += '<h2 class="seccion">Detalle</h2><div class="rejilla">';
  html += tabla('Top búsquedas (consultas)', G.queries, 'Consulta');
  html += tabla('Páginas más vistas en Google', G.paginas, 'Página', true);
  html += '</div>';

  cont.innerHTML = html;

  function tabla(titulo, filas, etqClave, esUrl){
    let h = '<div class="panel"><h3 style="margin-bottom:12px;font-size:16px">'+titulo+'</h3><table><tr><th>'+etqClave+'</th><th class="num">Clics</th><th class="num">Impr.</th><th class="num">Pos.</th></tr>';
    (filas||[]).forEach(f=>{
      let clave = f.clave;
      if(esUrl){ clave = clave.replace(/^https?:\/\/[^/]+/,'') || '/'; }
      h += '<tr><td class="clave" title="'+f.clave+'">'+clave+'</td><td class="num">'+num(f.clicks)+'</td><td class="num">'+num(f.impressions)+'</td><td class="num">'+String(f.position).replace('.',',')+'</td></tr>';
    });
    h += '</table></div>';
    return h;
  }

  function grafico(dias){
    if(!dias || dias.length<2) return '<p style="color:var(--suave)">Sin datos suficientes.</p>';
    const W=1060, H=240, pad=44;
    const xs=dias.map((d,i)=>pad+i*(W-2*pad)/(dias.length-1));
    const maxV=Math.max(...dias.map(d=>d.clicks))*1.15||1;
    const ys=dias.map(d=>H-pad-(d.clicks/maxV)*(H-2*pad));
    const pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
    const area=pts+' '+xs[xs.length-1]+','+(H-pad)+' '+xs[0]+','+(H-pad);
    // etiquetas: primera, media y última fecha
    const idxs=[0, Math.floor(dias.length/2), dias.length-1];
    let labels=idxs.map(i=>'<text x="'+xs[i]+'" y="'+(H-pad+20)+'" text-anchor="middle" font-size="11" fill="#6b7688">'+dias[i].fecha.slice(5)+'</text>').join('');
    return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34a0d9" stop-opacity="0.30"/><stop offset="100%" stop-color="#34a0d9" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+area+'" fill="url(#g)"></polygon>'+
      '<polyline points="'+pts+'" fill="none" stroke="#1f5f9b" stroke-width="2.5"></polyline>'+labels+
      '<text x="'+pad+'" y="24" font-size="12" fill="#13294b" font-weight="700">Clics por día</text></svg>';
  }
})();
</script>
</body>
</html>
