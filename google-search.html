<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visibilidad en Google · Search Console · INGESCO</title>
<link rel="icon" type="image/png" href="assets/favicon.ico.png">
<script src="assets/gate.js"></script>
<style>
  :root{--navy:#0f4d2e;--azul:#15803d;--cielo:#34c759;--fondo:#e7f6ec;
    --tarjeta:#f8fdfa;--texto:#10341f;--suave:#5c7a67;--borde:#c9e7d3;
    --verde:#16a34a;--rojo:#dc2626;--ambar:#d97706}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);padding:32px 24px 64px}
  .contenedor{max-width:1120px;margin:0 auto}
  a{text-decoration:none;color:inherit}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:26px;border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:50px;width:auto}
  .titulo .sep{width:1px;height:44px;background:var(--borde)}
  .titulo h1{font-size:22px;font-weight:800;color:var(--navy)}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:12px;color:var(--suave)}
  .btn-inicio{background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;margin-bottom:8px}
  .btn-inicio:hover{filter:brightness(1.15)}
  h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:32px 0 14px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600}
  .kpi .valor{font-size:32px;font-weight:800;margin-top:6px;color:var(--navy);line-height:1}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:6px}
  .kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)} .kpi .delta.flat{color:var(--suave)}
  .kpi .tot{font-size:12.5px;color:var(--suave);margin-top:10px;padding-top:8px;border-top:1px dashed var(--borde)}
  .kpi .tot b{color:var(--navy);font-weight:800}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h3{font-size:16px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--borde)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.clave{font-weight:600;color:var(--navy);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:24px;border-radius:14px}
  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
  /* Indexación */
  .idx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
  .idx-card{border-radius:14px;padding:20px;border:1px solid var(--borde)}
  .idx-card.ok{background:#ecfdf5;border-color:#a7f3d0}
  .idx-card.no{background:#fef2f2;border-color:#fecaca}
  .idx-card .etq{font-size:13px;font-weight:700}
  .idx-card.ok .etq{color:#047857} .idx-card.no .etq{color:#b91c1c}
  .idx-card .valor{font-size:34px;font-weight:800;margin-top:4px;color:var(--navy)}
  .desple{border:1px solid var(--borde);border-radius:10px;margin:8px 0;overflow:hidden}
  .desple-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;font-size:14px}
  .desple-h:hover{background:#f8fafc}
  .desple-h .izq{display:flex;align-items:center;gap:9px}
  .desple-h .flecha{color:var(--cielo);font-size:12px;width:12px}
  .desple-h b{font-weight:700}
  .desple-h .cnt{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .url-list{display:none;max-height:320px;overflow:auto;border-top:1px solid var(--borde);background:#fbfcfe}
  .url-list a{display:block;padding:7px 16px;font-size:12.5px;color:var(--azul);border-bottom:1px solid #eef2f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .url-list a:hover{background:#eef5ff;text-decoration:underline}
  @media(max-width:600px){
    body{padding:22px 14px 48px}
    .titulo h1{font-size:19px}
    .titulo .logo{height:42px}
    .panel{overflow-x:auto}
    table{min-width:480px}
    td.clave{max-width:200px}
    .idx-kpis{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>🔍 Visibilidad en Google</h1>
        <p>Search Console · presencia en el buscador</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-inicio" href="index.html">← Inicio</a><br>
      <span id="periodo">—</span><br><span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer><b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 · Fuente: Google Search Console</footer>
</div>

<script src="https://aleixxruiz.github.io/dashboardmktstats/datos/gsc.js"></script>
<script src="https://aleixxruiz.github.io/dashboardmktstats/datos/indexacion.js"></script>
<script>
  window.toggleDesple=function(id){
    var e=document.getElementById(id), f=document.getElementById('f'+id);
    if(!e)return; var open=e.style.display==='block';
    e.style.display=open?'none':'block'; if(f)f.textContent=open?'▸':'▾';
  };
(function(){
  const cont = document.getElementById('contenido');
  if(typeof window.GSC === 'undefined'){
    cont.innerHTML = '<div class="vacio">⚠️ <b>Aún no hay datos.</b> Ejecuta «Actualizar datos» y recarga.</div>';
    return;
  }
  const G = window.GSC;
  const num = n => Number(n||0).toLocaleString('es-ES');
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  document.getElementById('periodo').textContent = 'Último mes: ' + G.periodo.ini + ' – ' + G.periodo.fin;
  document.getElementById('actualizado').textContent = 'Actualizado: ' + G.fechaActualizacion;

  const t = G.totales, tl = G.totalesLargo || {};
  function delta(cur,prev){
    if(!prev) return '<div class="delta flat">—</div>';
    const d=(cur-prev)/prev*100, cls=d>=0?'up':'down', fl=d>=0?'▲':'▼';
    return '<div class="delta '+cls+'">'+fl+' '+Math.abs(d).toFixed(1).replace('.',',')+'% vs. mes anterior</div>';
  }

  // ===== BLOQUE 1: RENDIMIENTO (último mes grande + totales pequeño) =====
  let html='<h2 class="seccion">Rendimiento</h2><div class="kpis">';
  html+=kpi('🖱️ Clics', num(t.clicks), delta(t.clicks,t.clicksPrev), 'Totales (desde '+(tl.desde||'—')+'): <b>'+num(tl.clicks)+'</b>');
  html+=kpi('👁️ Impresiones', num(t.impressions), delta(t.impressions,t.impressionsPrev), 'Totales: <b>'+num(tl.impressions)+'</b>');
  html+=kpi('📊 CTR medio', String(t.ctr).replace('.',',')+'%', '<div class="delta flat">clics ÷ impresiones</div>', 'Total: <b>'+String(tl.ctr||0).replace('.',',')+'%</b>');
  html+=kpi('📍 Posición media', String(t.position).replace('.',','), '<div class="delta flat">más baja = mejor</div>', 'Total: <b>'+String(tl.position||0).replace('.',',')+'</b>');
  html+='</div>';

  // Evolución
  html+='<h2 class="seccion">Evolución diaria (clics)</h2><div class="panel">'+grafico(G.porDia)+'</div>';

  // ===== BLOQUE 2: INDEXACIÓN =====
  html+='<h2 class="seccion">Páginas en el índice de Google</h2>'+bloqueIndexacion();

  // ===== BLOQUE 3: CONSULTAS =====
  html+='<h2 class="seccion">Consultas (por qué te buscan)</h2>';
  html+=tablaQueries(G.queries||[]);

  // Páginas
  html+='<h2 class="seccion">Páginas con mejor rendimiento</h2>';
  html+=tablaPaginas(G.paginas||[]);

  cont.innerHTML = html;

  // ---------- componentes ----------
  function kpi(etq,val,delta,tot){
    return '<div class="kpi"><div class="etq">'+etq+'</div><div class="valor">'+val+'</div>'+delta+'<div class="tot">'+tot+'</div></div>';
  }

  function bloqueIndexacion(){
    const I = window.INDEX;
    if(typeof I === 'undefined'){
      return '<div class="panel" style="color:var(--suave);font-size:14px;line-height:1.6">⏳ Las páginas indexadas/no indexadas se calculan <b>una vez por semana</b> (es un proceso lento que inspecciona ~1.000 páginas). Aparecerán aquí en cuanto termine la primera comprobación.</div>';
    }
    let h='<div class="panel"><div class="idx-kpis">'+
      '<div class="idx-card ok"><div class="etq">✅ Indexadas en Google</div><div class="valor">'+num(I.indexadas)+'</div></div>'+
      '<div class="idx-card no"><div class="etq">🚫 No indexadas</div><div class="valor">'+num(I.noIndexadas)+'</div></div>'+
      '<div class="idx-card" style="background:#f8fafc"><div class="etq" style="color:var(--suave)">Páginas comprobadas</div><div class="valor">'+num(I.total)+'</div></div>'+
      '</div>';
    // Desplegable: indexadas
    h+=desple('idx_ok', '✅ Ver páginas indexadas', I.indexadas, (I.listaIndexadas||[]));
    // Desplegables: no indexadas por motivo
    (I.motivos||[]).forEach((m,i)=>{ h+=desple('idx_no'+i, '🚫 '+esc(m.motivo), m.total, (m.urls||[])); });
    h+='</div>';
    return h;
  }
  function desple(id, titulo, cnt, urls){
    let h='<div class="desple"><div class="desple-h" onclick="toggleDesple(\''+id+'\')">'+
      '<span class="izq"><span class="flecha" id="f'+id+'">▸</span><b>'+titulo+'</b></span><span class="cnt">'+num(cnt)+'</span></div>'+
      '<div class="url-list" id="'+id+'">';
    (urls||[]).forEach(u=>{ const uu=esc(u); h+='<a href="'+uu+'" target="_blank" rel="noopener" title="'+uu+'">'+uu.replace(/^https?:\/\/[^/]+/,'')+'</a>'; });
    if(!urls||urls.length===0) h+='<a style="color:var(--suave)">(sin URLs)</a>';
    h+='</div></div>';
    return h;
  }

  function tablaQueries(filas){
    let h='<div class="panel"><table><tr><th>Consulta</th><th class="num">Clics</th><th class="num">Impresiones</th><th class="num">CTR</th><th class="num">Pos.</th></tr>';
    filas.forEach(f=>{ h+='<tr><td class="clave" title="'+esc(f.clave)+'">'+esc(f.clave)+'</td><td class="num">'+num(f.clicks)+'</td><td class="num">'+num(f.impressions)+'</td><td class="num">'+String(f.ctr).replace('.',',')+'%</td><td class="num">'+String(f.position).replace('.',',')+'</td></tr>'; });
    return h+'</table></div>';
  }
  function tablaPaginas(filas){
    let h='<div class="panel"><table><tr><th>Página</th><th class="num">Clics</th><th class="num">Impr.</th><th class="num">Pos.</th></tr>';
    filas.forEach(f=>{ const u=esc(f.clave), ruta=u.replace(/^https?:\/\/[^/]+/,'')||'/';
      h+='<tr><td class="clave"><a href="'+u+'" target="_blank" rel="noopener" title="'+u+'" style="color:var(--azul)">'+ruta+' ↗</a></td><td class="num">'+num(f.clicks)+'</td><td class="num">'+num(f.impressions)+'</td><td class="num">'+String(f.position).replace('.',',')+'</td></tr>'; });
    return h+'</table></div>';
  }
  function grafico(dias){
    if(!dias||dias.length<2) return '<p style="color:var(--suave)">Sin datos suficientes.</p>';
    const W=1060,H=240,pad=44;
    const xs=dias.map((d,i)=>pad+i*(W-2*pad)/(dias.length-1));
    const maxV=Math.max(...dias.map(d=>d.clicks))*1.15||1;
    const ys=dias.map(d=>H-pad-(d.clicks/maxV)*(H-2*pad));
    const pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
    const area=pts+' '+xs[xs.length-1]+','+(H-pad)+' '+xs[0]+','+(H-pad);
    const idxs=[0,Math.floor(dias.length/2),dias.length-1];
    const labels=idxs.map(i=>'<text x="'+xs[i]+'" y="'+(H-pad+20)+'" text-anchor="middle" font-size="11" fill="#6b7688">'+dias[i].fecha.slice(5)+'</text>').join('');
    return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34c759" stop-opacity="0.32"/><stop offset="100%" stop-color="#34c759" stop-opacity="0"/></linearGradient></defs>'+
      '<polygon points="'+area+'" fill="url(#g)"></polygon><polyline points="'+pts+'" fill="none" stroke="#15803d" stroke-width="2.5"></polyline>'+labels+'</svg>';
  }
})();
</script>
<script src="assets/widget.js?v=11"></script>
</body>
</html>
