<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captación de Leads · HubSpot · INGESCO</title>
<link rel="icon" type="image/png" href="assets/favicon.ico.png">
<script src="assets/gate.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
<style>
  :root{--navy:#7a3300;--azul:#ec7a1a;--cielo:#f7a93a;--fondo:#fff1e3;
    --tarjeta:#fffaf4;--texto:#3a2000;--suave:#9a7350;--borde:#f4dcc2;
    --verde:#16a34a;--rojo:#dc2626;--naranja:#e08a2b;--lima:#9cb500}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);padding:32px 24px 64px}
  .contenedor{max-width:1120px;margin:0 auto}
  a{text-decoration:none}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:26px;border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:50px;width:auto}
  .titulo .sep{width:1px;height:44px;background:var(--borde)}
  .titulo h1{font-size:22px;font-weight:800;color:var(--navy)}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:12px;color:var(--suave)}
  .btn-inicio{background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;margin-bottom:8px}
  .btn-inicio:hover{filter:brightness(1.15)}
  h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:32px 0 14px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600}
  .kpi .valor{font-size:30px;font-weight:800;margin-top:8px;color:var(--navy)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:6px}
  .kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)} .kpi .delta.flat{color:var(--suave)}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.rejilla{grid-template-columns:1fr}}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h3{font-size:16px;margin-bottom:16px}
  .barra{margin:11px 0}
  .barra .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .barra .top b{font-weight:700}
  .pista{background:#eef2f7;border-radius:7px;height:11px;overflow:hidden}
  .relleno{height:100%;border-radius:7px}
  .barra.desplegable{cursor:pointer;user-select:none}
  .barra.desplegable:hover .top>span{color:var(--azul)}
  .flecha{display:inline-block;width:13px;color:var(--azul);font-size:11px}
  .detalle{margin:2px 0 14px 22px;padding-left:14px;border-left:2px solid var(--borde)}
  .detalle .barra{margin:8px 0}
  .vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:24px;border-radius:14px}
  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
  .mapa-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px}
  @media(max-width:860px){.mapa-wrap{grid-template-columns:1fr}}
  .mapa-cont{position:relative;width:100%}
  #mapa{width:100%;height:440px}
  .burbuja{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(234,122,26,.92);
    color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.28);font-size:10.5px;pointer-events:none;z-index:4;line-height:1}
  .burbuja.hl{background:#b91c1c;box-shadow:0 0 0 5px rgba(185,28,28,.30);transform:translate(-50%,-50%) scale(1.4);z-index:9;transition:.2s}
  .paises-lista{max-height:440px;overflow:auto;padding-right:6px}
  .pais-row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:1px 0;padding:6px 8px;border-radius:8px;cursor:pointer}
  .pais-row:hover{background:#fff3e8}
  .pais-row.hl{background:#ffe1c2}
  .pais-row .ban{font-size:18px;width:24px;text-align:center}
  .pais-row .nom{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pais-row .val{font-weight:800;color:var(--azul);font-variant-numeric:tabular-nums}
  .jvm-tooltip{background:#7a3300;font-weight:600}
  @media(max-width:600px){
    body{padding:22px 14px 48px}
    .titulo h1{font-size:19px}
    .titulo .logo{height:42px}
    .barra .top{font-size:12.5px}
    .detalle{margin-left:10px;padding-left:10px}
  }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>🧲 Captación de Leads</h1>
        <p>HubSpot · contactos y su origen</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-inicio" href="index.html">← Inicio</a><br>
      <span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer><b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 · Fuente: HubSpot CRM</footer>
</div>

<script src="datos/leads.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script>
(function(){
  const cont = document.getElementById('contenido');
  if(typeof window.LEADS === 'undefined'){
    cont.innerHTML = '<div class="vacio">⚠️ <b>Aún no hay datos.</b> Ejecuta «Actualizar datos» y recarga.</div>';
    return;
  }
  const L = window.LEADS;
  const num = n => Number(n||0).toLocaleString('es-ES');
  if(!L.total){
    cont.innerHTML = '<div class="vacio">⚠️ <b>De momento no hay datos de HubSpot.</b><br>La última actualización no devolvió contactos (probablemente el token de HubSpot caducó o se reemplazó). En cuanto se restablezca el token, los datos volverán a aparecer aquí.</div>';
    return;
  }
  const colores = ['#ec7a1a','#f7a93a','#c2410c','#fb923c','#d97706','#b45309','#f97316','#9a3412','#7c2d12','#a87f5a'];
  document.getElementById('actualizado').textContent = 'Actualizado: ' + L.fechaActualizacion;

  // Traducción de orígenes de HubSpot
  const FUENTES = {
    DIRECT_TRAFFIC:'Tráfico directo', ORGANIC_SEARCH:'Búsqueda orgánica', OFFLINE:'Offline (import/chat/manual)',
    SOCIAL_MEDIA:'Redes sociales', PAID_SOCIAL:'Redes sociales (pago)', REFERRALS:'Referencias',
    PAID_SEARCH:'Búsqueda de pago', OTHER_CAMPAIGNS:'Otras campañas', AI_REFERRALS:'Referencias de IA',
    EMAIL_MARKETING:'Email marketing', DESCONOCIDO:'Desconocido'
  };
  const nf = k => FUENTES[k] || k;

  // Traducción de los códigos de idioma (los datos guardan ES/EN/… para evitar acentos en el script)
  const IDIOMAS = { ES:'🇪🇸 Español', EN:'🇬🇧 Inglés', FR:'🇫🇷 Francés', PT:'🇵🇹 Portugués', OTROS:'🌐 Sin idioma definido (app e internos)' };

  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const mesLabel = ym => { const p=ym.split('-'); return meses[parseInt(p[1])-1]+' '+p[0].slice(2); };

  function delta(cur,prev){
    if(!prev) return '<div class="delta flat">—</div>';
    const d=(cur-prev)/prev*100, cls=d>=0?'up':'down', fl=d>=0?'▲':'▼';
    return '<div class="delta '+cls+'">'+fl+' '+Math.abs(d).toFixed(0)+'% vs. 30 días previos</div>';
  }

  const topFuente = (L.porFuente&&L.porFuente[0])||{nombre:'-',valor:0};
  const pctTop = L.total? Math.round(topFuente.valor/L.total*100):0;
  const esteMes = (L.porMes&&L.porMes.length)? L.porMes[L.porMes.length-1].valor : 0;

  let html='<div class="kpis">';
  html+='<div class="kpi"><div class="etq">👥 Total de leads</div><div class="valor">'+num(L.total)+'</div><div class="delta flat">contactos en HubSpot</div></div>';
  html+='<div class="kpi"><div class="etq">🆕 Nuevos (30 días)</div><div class="valor">'+num(L.nuevos30)+'</div>'+delta(L.nuevos30,L.nuevosPrev30)+'</div>';
  html+='<div class="kpi"><div class="etq">🎯 Origen principal</div><div class="valor">'+pctTop+'%</div><div class="delta flat">'+nf(topFuente.nombre)+'</div></div>';
  html+='<div class="kpi"><div class="etq">📅 Captados este mes</div><div class="valor">'+num(esteMes)+'</div><div class="delta flat">mes en curso</div></div>';
  html+='</div>';

  // Nombres de país en español (debe estar listo ANTES de construir la lista)
  var DN=null; try{ DN=new Intl.DisplayNames(['es'],{type:'region'}); }catch(e){}

  // Mapa de contactos por país
  let paisTotal=0; (L.porPais||[]).forEach(function(p){ paisTotal+=p.valor; });
  if((L.porPais||[]).length){
    html+='<h2 class="seccion">Contactos por país</h2>';
    html+='<div class="panel"><div class="mapa-wrap"><div class="mapa-cont"><div id="mapa"></div></div>'+
      '<div><h3 style="font-size:15px;margin-bottom:8px">Países ('+L.porPais.length+')</h3>'+
      '<div class="paises-lista">'+listaPaises(L.porPais||[])+'</div></div></div>'+
      '<div style="color:var(--suave);font-size:12px;margin-top:10px">Basado en <b>'+num(paisTotal)+'</b> contactos con país conocido (de '+num(L.total)+'). Pasa el ratón por el mapa, o haz clic en un país de la lista para localizarlo.</div></div>';
  }

  html+='<h2 class="seccion">Evolución mensual de captación</h2><div class="panel">'+grafico(L.porMes)+
        '<div style="color:var(--suave);font-size:12.5px;margin-top:6px">👆 Haz clic en un mes para ver por qué formularios se captaron esos leads.</div>'+
        '<div id="mesDetalle" style="display:none;margin-top:14px;border-top:1px dashed var(--borde);padding-top:14px"></div></div>';

  html+='<h2 class="seccion">Cómo llegaron los contactos</h2>';
  html+=barrasForm('Todos los contactos ('+num(L.total)+') según cómo entraron — clic en un grupo para desplegar el detalle', (L.porFormulario||[]), L.total);

  html+='<h2 class="seccion">Captación por idioma</h2>';
  if(L.porIdioma && L.porIdioma.length){
    const idiomas=L.porIdioma.map(function(g){ return {nombre:(IDIOMAS[g.nombre]||g.nombre), valor:g.valor, detalle:g.detalle}; });
    const baseIdi=L.conFormulario||L.total;
    html+=barrasForm('Formularios agrupados por idioma ('+num(baseIdi)+' contactos con formulario) — clic en un idioma para ver sus formularios', idiomas, baseIdi, 'idi');
  } else {
    html+='<div class="panel" style="color:var(--suave)">El desglose por idioma aparecerá tras la próxima actualización de datos de HubSpot.</div>';
  }

  cont.innerHTML = html;
  if((L.porPais||[]).length) pintarMapa();

  function barras(titulo, filas, total){
    const max=Math.max(...filas.map(f=>f.valor),1);
    let h='<div class="panel"><h3>'+titulo+'</h3>';
    filas.forEach((f,i)=>{
      const w=Math.round(f.valor/max*100);
      const pc=total?Math.round(f.valor/total*100):0;
      h+='<div class="barra"><div class="top"><span>'+f.nombre+'</span><b>'+num(f.valor)+' · '+pc+'%</b></div>'+
         '<div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:'+colores[i%colores.length]+'"></div></div></div>';
    });
    return h+'</div>';
  }

  // Como 'barras' pero con grupos desplegables (los que tienen .detalle)
  function barrasForm(titulo, filas, total, pref){
    const max=Math.max(...filas.map(f=>f.valor),1);
    let h='<div class="panel"><h3>'+titulo+'</h3>';
    filas.forEach((f,i)=>{
      const w=Math.round(f.valor/max*100);
      const pc=total?Math.round(f.valor/total*100):0;
      const col=colores[i%colores.length];
      const det=f.detalle&&f.detalle.length;
      const id=(pref||'g')+i;
      h+='<div class="barra'+(det?' desplegable':'')+'"'+(det?(" onclick=\"toggleDet('"+id+"')\""):"")+'>'+
         '<div class="top"><span>'+(det?'<span class="flecha" id="fl'+id+'">▸</span> ':'')+f.nombre+
         (det?' <small style="color:var(--suave);font-weight:600">('+f.detalle.length+' formularios)</small>':'')+
         '</span><b>'+num(f.valor)+' · '+pc+'%</b></div>'+
         '<div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:'+col+'"></div></div></div>';
      if(det){
        const maxd=Math.max(...f.detalle.map(d=>d.valor),1);
        h+='<div class="detalle" id="'+id+'" style="display:none">';
        f.detalle.forEach(d=>{
          const wd=Math.round(d.valor/maxd*100), pcd=total?Math.round(d.valor/total*100):0;
          h+='<div class="barra"><div class="top"><span>'+nf(d.nombre)+'</span><b>'+num(d.valor)+' · '+pcd+'%</b></div>'+
             '<div class="pista"><div class="relleno" style="width:'+Math.max(wd,2)+'%;background:#c9a98a"></div></div></div>';
        });
        h+='</div>';
      }
    });
    return h+'</div>';
  }

  window.toggleDet=function(id){
    var e=document.getElementById(id), f=document.getElementById('fl'+id);
    if(!e)return;
    var open=e.style.display!=='none';
    e.style.display=open?'none':'block';
    if(f)f.textContent=open?'▸':'▾';
  };

  // Muestra el desglose por formulario del mes seleccionado en la gráfica mensual
  window.mostrarMesForm=function(mes){
    var det=document.getElementById('mesDetalle'); if(!det) return;
    var m=(L.porMes||[]).filter(function(x){ return x.nombre===mes; })[0];
    if(!m || !m.detalle || !m.detalle.length){
      det.style.display='block';
      det.innerHTML='<div style="color:var(--suave)">Sin desglose de formularios para '+mesLabel(mes)+'.</div>';
      return;
    }
    var total=m.valor||0;
    var max=Math.max.apply(null, m.detalle.map(function(d){ return d.valor; }).concat([1]));
    var h='<h3 style="font-size:15px;margin-bottom:12px">Formularios · '+mesLabel(mes)+' <span style="color:var(--suave);font-weight:600">('+num(total)+' leads)</span></h3>';
    m.detalle.forEach(function(d){
      var w=Math.round(d.valor/max*100), pc=total?Math.round(d.valor/total*100):0;
      h+='<div class="barra"><div class="top"><span>'+d.nombre+'</span><b>'+num(d.valor)+' · '+pc+'%</b></div>'+
         '<div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:#ec7a1a"></div></div></div>';
    });
    det.innerHTML=h; det.style.display='block';
  };

  function grafico(porMes){
    porMes = Array.isArray(porMes)?porMes:[];
    if(porMes.length<2) return '<p style="color:var(--suave)">Sin datos suficientes.</p>';
    const datos = porMes.slice(-12);
    const W=1060,H=260,pad=46;
    const n=datos.length, bw=(W-2*pad)/n*0.62, gap=(W-2*pad)/n;
    const max=Math.max(...datos.map(d=>d.valor))*1.15||1;
    let bars='';
    datos.forEach((d,i)=>{
      const x=pad+i*gap+(gap-bw)/2;
      const bh=(d.valor/max)*(H-2*pad);
      const y=H-pad-bh;
      const cx=pad+i*gap;
      bars+='<rect x="'+cx+'" y="'+pad+'" width="'+gap+'" height="'+(H-2*pad)+'" fill="transparent" style="cursor:pointer" onclick="mostrarMesForm(\''+d.nombre+'\')"></rect>'+
            '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="#ec7a1a" style="cursor:pointer" onclick="mostrarMesForm(\''+d.nombre+'\')"></rect>'+
            '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="11" fill="#3a2000" font-weight="700" style="pointer-events:none">'+d.valor+'</text>'+
            '<text x="'+(x+bw/2)+'" y="'+(H-pad+18)+'" text-anchor="middle" font-size="10.5" fill="#6b7688" style="pointer-events:none">'+mesLabel(d.nombre)+'</text>';
    });
    return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><text x="'+pad+'" y="22" font-size="12" fill="#3a2000" font-weight="700">Leads nuevos por mes (últimos 12)</text>'+bars+'</svg>';
  }

  // ---- Mapa de contactos por país ----
  function nombrePais(code){ try{ return (DN&&DN.of(code))||code; }catch(e){ return code; } }
  function bandera(code){ if(!code||code.length!==2) return '🌐'; return code.toUpperCase().replace(/./g,function(c){ return String.fromCodePoint(127397+c.charCodeAt(0)); }); }
  function listaPaises(arr){ let h=''; (arr||[]).forEach(function(p){ const c=(p.code||'').toUpperCase(); h+='<div class="pais-row" id="row-'+c+'" onclick="irPais(\''+c+'\')"><span class="ban">'+bandera(p.code)+'</span><span class="nom">'+nombrePais(p.code)+'</span><span class="val">'+num(p.valor)+'</span></div>'; }); return h; }
  function shortNum(n){ return n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k' : ''+n; }
  const burbujas={};
  function pintarMapa(){
    const valores={}; (L.porPais||[]).forEach(function(p){ if(p.code) valores[p.code.toUpperCase()]=p.valor; });
    const maxV=Math.max.apply(null, Object.keys(valores).map(function(k){return valores[k];}).concat([1]));
    const mapaEl=document.getElementById('mapa');
    function fallback(msg){ if(mapaEl) mapaEl.innerHTML='<div style="padding:30px;color:var(--suave);text-align:center">🌐 '+msg+'</div>'; }
    if(!window.jsVectorMap){ fallback('Mapa no disponible (sin conexión).'); return; }
    try{
      new window.jsVectorMap({ selector:'#mapa', map:'world', zoomButtons:false, zoomOnScroll:false, draggable:false, backgroundColor:'transparent',
        regionStyle:{ initial:{ fill:'#e9edf0', stroke:'#ffffff', strokeWidth:0.5 }, hover:{ fill:'#d8dee4' } },
        onLoaded:function(){ setTimeout(function(){ dibujarBurbujas(valores,maxV); }, 120); },
        onRegionTooltipShow:function(event,tooltip,code){ const v=valores[code]; if(v!=null) tooltip.text(tooltip.text()+' · '+num(v)+' contactos', true); }
      });
      setTimeout(function(){ if(!Object.keys(burbujas).length) dibujarBurbujas(valores,maxV); }, 600);
      window.addEventListener('resize', function(){ clearTimeout(window._burbT); window._burbT=setTimeout(function(){ dibujarBurbujas(valores,maxV); }, 250); });
    }catch(e){ fallback('No se pudo dibujar el mapa.'); }
  }
  function dibujarBurbujas(valores, maxV){
    const cont=document.querySelector('.mapa-cont'), mapaEl=document.getElementById('mapa');
    if(!cont||!mapaEl) return;
    cont.querySelectorAll('.burbuja').forEach(function(b){ b.remove(); });
    Object.keys(burbujas).forEach(function(k){ delete burbujas[k]; });
    const cr=cont.getBoundingClientRect();
    const byCode={}; mapaEl.querySelectorAll('path').forEach(function(p){ const c=(p.getAttribute('data-code')||p.id||'').toUpperCase(); if(c) byCode[c]=p; });
    Object.keys(valores).forEach(function(code){
      const path=byCode[code]; if(!path) return;
      const r=path.getBoundingClientRect(); if(!r.width) return;
      const cx=r.left+r.width/2-cr.left, cy=r.top+r.height/2-cr.top;
      const v=valores[code], size=Math.round(18+Math.sqrt(v)/Math.sqrt(maxV)*24);
      const b=document.createElement('div'); b.className='burbuja';
      b.style.left=cx+'px'; b.style.top=cy+'px'; b.style.width=size+'px'; b.style.height=size+'px';
      b.textContent=shortNum(v); b.title=nombrePais(code)+': '+num(v);
      cont.appendChild(b); burbujas[code]=b;
    });
  }
  window.irPais=function(code){
    const cont=document.querySelector('.mapa-cont'); if(cont) cont.scrollIntoView({behavior:'smooth',block:'center'});
    document.querySelectorAll('.pais-row.hl').forEach(function(r){ r.classList.remove('hl'); });
    const row=document.getElementById('row-'+code); if(row) row.classList.add('hl');
    const b=burbujas[code]; if(b){ b.classList.add('hl'); setTimeout(function(){ b.classList.remove('hl'); }, 1800); }
  };
})();
</script>
<script src="assets/widget.js?v=9"></script>
</body>
</html>
