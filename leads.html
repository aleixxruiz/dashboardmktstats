<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captación de Leads · HubSpot · INGESCO</title>
<link rel="icon" type="image/png" href="assets/favicon.ico.png">
<style>
  :root{--navy:#13294b;--azul:#1f5f9b;--cielo:#34a0d9;--fondo:#f4f6f9;
    --tarjeta:#fff;--texto:#13294b;--suave:#6b7688;--borde:#e3e8ef;
    --verde:#16a34a;--rojo:#dc2626;--naranja:#e08a2b;--lima:#9cb500}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);padding:32px 24px 64px}
  .contenedor{max-width:1120px;margin:0 auto}
  a{text-decoration:none}
  header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:26px;border-bottom:3px solid var(--navy);padding-bottom:18px}
  .titulo{display:flex;align-items:center;gap:18px}
  .titulo .logo{height:50px;width:auto}
  .titulo .sep{width:1px;height:44px;background:var(--borde)}
  .titulo h1{font-size:22px;font-weight:800;color:var(--navy)}
  .titulo p{color:var(--suave);font-size:13px;margin-top:3px}
  .meta{text-align:right;font-size:12px;color:var(--suave)}
  .btn-inicio{background:var(--navy);color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;margin-bottom:8px}
  .btn-inicio:hover{filter:brightness(1.15)}
  h2.seccion{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--suave);margin:32px 0 14px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .kpi{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .kpi .etq{font-size:13px;color:var(--suave);font-weight:600}
  .kpi .valor{font-size:30px;font-weight:800;margin-top:8px;color:var(--navy)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:6px}
  .kpi .delta.up{color:var(--verde)} .kpi .delta.down{color:var(--rojo)} .kpi .delta.flat{color:var(--suave)}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.rejilla{grid-template-columns:1fr}}
  .panel{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h3{font-size:16px;margin-bottom:16px}
  .barra{margin:11px 0}
  .barra .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .barra .top b{font-weight:700}
  .pista{background:#eef2f7;border-radius:7px;height:11px;overflow:hidden}
  .relleno{height:100%;border-radius:7px}
  .barra.desplegable{cursor:pointer;user-select:none}
  .barra.desplegable:hover .top>span{color:var(--azul)}
  .flecha{display:inline-block;width:13px;color:var(--azul);font-size:11px}
  .detalle{margin:2px 0 14px 22px;padding-left:14px;border-left:2px solid var(--borde)}
  .detalle .barra{margin:8px 0}
  .vacio{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:24px;border-radius:14px}
  footer{margin-top:40px;text-align:center;color:var(--suave);font-size:12px}
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div class="titulo">
      <img class="logo" src="assets/logo-ingesco.png" alt="INGESCO">
      <div class="sep"></div>
      <div>
        <h1>🧲 Captación de Leads</h1>
        <p>HubSpot · contactos y su origen</p>
      </div>
    </div>
    <div class="meta">
      <a class="btn-inicio" href="index.html">← Inicio</a><br>
      <span id="actualizado">—</span>
    </div>
  </header>

  <div id="contenido"></div>

  <footer><b>INGESCO®</b> · Joining sky and ground. Protecting you since 1973 · Fuente: HubSpot CRM</footer>
</div>

<script src="datos/leads.js"></script>
<script>
(function(){
  const cont = document.getElementById('contenido');
  if(typeof window.LEADS === 'undefined'){
    cont.innerHTML = '<div class="vacio">⚠️ <b>Aún no hay datos.</b> Ejecuta «Actualizar datos» y recarga.</div>';
    return;
  }
  const L = window.LEADS;
  const num = n => Number(n||0).toLocaleString('es-ES');
  const colores = ['#1f5f9b','#34a0d9','#13294b','#e08a2b','#16a34a','#9333ea','#dc2626','#0891b2','#65a30d','#6b7688'];
  document.getElementById('actualizado').textContent = 'Actualizado: ' + L.fechaActualizacion;

  // Traducción de orígenes de HubSpot
  const FUENTES = {
    DIRECT_TRAFFIC:'Tráfico directo', ORGANIC_SEARCH:'Búsqueda orgánica', OFFLINE:'Offline (import/chat/manual)',
    SOCIAL_MEDIA:'Redes sociales', PAID_SOCIAL:'Redes sociales (pago)', REFERRALS:'Referencias',
    PAID_SEARCH:'Búsqueda de pago', OTHER_CAMPAIGNS:'Otras campañas', AI_REFERRALS:'Referencias de IA',
    EMAIL_MARKETING:'Email marketing', DESCONOCIDO:'Desconocido'
  };
  const nf = k => FUENTES[k] || k;

  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const mesLabel = ym => { const p=ym.split('-'); return meses[parseInt(p[1])-1]+' '+p[0].slice(2); };

  function delta(cur,prev){
    if(!prev) return '<div class="delta flat">—</div>';
    const d=(cur-prev)/prev*100, cls=d>=0?'up':'down', fl=d>=0?'▲':'▼';
    return '<div class="delta '+cls+'">'+fl+' '+Math.abs(d).toFixed(0)+'% vs. 30 días previos</div>';
  }

  const topFuente = (L.porFuente&&L.porFuente[0])||{nombre:'-',valor:0};
  const pctTop = L.total? Math.round(topFuente.valor/L.total*100):0;
  const esteMes = (L.porMes&&L.porMes.length)? L.porMes[L.porMes.length-1].valor : 0;

  let html='<div class="kpis">';
  html+='<div class="kpi"><div class="etq">👥 Total de leads</div><div class="valor">'+num(L.total)+'</div><div class="delta flat">contactos en HubSpot</div></div>';
  html+='<div class="kpi"><div class="etq">🆕 Nuevos (30 días)</div><div class="valor">'+num(L.nuevos30)+'</div>'+delta(L.nuevos30,L.nuevosPrev30)+'</div>';
  html+='<div class="kpi"><div class="etq">🎯 Origen principal</div><div class="valor">'+pctTop+'%</div><div class="delta flat">'+nf(topFuente.nombre)+'</div></div>';
  html+='<div class="kpi"><div class="etq">📅 Captados este mes</div><div class="valor">'+num(esteMes)+'</div><div class="delta flat">mes en curso</div></div>';
  html+='</div>';

  html+='<h2 class="seccion">Evolución mensual de captación</h2><div class="panel">'+grafico(L.porMes)+'</div>';

  html+='<h2 class="seccion">Cómo llegaron los contactos</h2>';
  html+=barrasForm('Todos los contactos ('+num(L.total)+') según cómo entraron — clic en un grupo para desplegar el detalle', (L.porFormulario||[]), L.total);

  html+='<h2 class="seccion">Segmentación</h2>';
  html+=barras('Por etapa del ciclo', L.porEtapa||[], L.total);

  cont.innerHTML = html;

  function barras(titulo, filas, total){
    const max=Math.max(...filas.map(f=>f.valor),1);
    let h='<div class="panel"><h3>'+titulo+'</h3>';
    filas.forEach((f,i)=>{
      const w=Math.round(f.valor/max*100);
      const pc=total?Math.round(f.valor/total*100):0;
      h+='<div class="barra"><div class="top"><span>'+f.nombre+'</span><b>'+num(f.valor)+' · '+pc+'%</b></div>'+
         '<div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:'+colores[i%colores.length]+'"></div></div></div>';
    });
    return h+'</div>';
  }

  // Como 'barras' pero con grupos desplegables (los que tienen .detalle)
  function barrasForm(titulo, filas, total){
    const max=Math.max(...filas.map(f=>f.valor),1);
    let h='<div class="panel"><h3>'+titulo+'</h3>';
    filas.forEach((f,i)=>{
      const w=Math.round(f.valor/max*100);
      const pc=total?Math.round(f.valor/total*100):0;
      const col=colores[i%colores.length];
      const det=f.detalle&&f.detalle.length;
      const id='g'+i;
      h+='<div class="barra'+(det?' desplegable':'')+'"'+(det?(" onclick=\"toggleDet('"+id+"')\""):"")+'>'+
         '<div class="top"><span>'+(det?'<span class="flecha" id="fl'+id+'">▸</span> ':'')+f.nombre+
         (det?' <small style="color:var(--suave);font-weight:600">('+f.detalle.length+' formularios)</small>':'')+
         '</span><b>'+num(f.valor)+' · '+pc+'%</b></div>'+
         '<div class="pista"><div class="relleno" style="width:'+Math.max(w,2)+'%;background:'+col+'"></div></div></div>';
      if(det){
        const maxd=Math.max(...f.detalle.map(d=>d.valor),1);
        h+='<div class="detalle" id="'+id+'" style="display:none">';
        f.detalle.forEach(d=>{
          const wd=Math.round(d.valor/maxd*100), pcd=total?Math.round(d.valor/total*100):0;
          h+='<div class="barra"><div class="top"><span>'+nf(d.nombre)+'</span><b>'+num(d.valor)+' · '+pcd+'%</b></div>'+
             '<div class="pista"><div class="relleno" style="width:'+Math.max(wd,2)+'%;background:#9aa3b2"></div></div></div>';
        });
        h+='</div>';
      }
    });
    return h+'</div>';
  }

  window.toggleDet=function(id){
    var e=document.getElementById(id), f=document.getElementById('fl'+id);
    if(!e)return;
    var open=e.style.display!=='none';
    e.style.display=open?'none':'block';
    if(f)f.textContent=open?'▸':'▾';
  };

  function grafico(porMes){
    if(!porMes||porMes.length<2) return '<p style="color:var(--suave)">Sin datos suficientes.</p>';
    const datos = porMes.slice(-12);
    const W=1060,H=260,pad=46;
    const n=datos.length, bw=(W-2*pad)/n*0.62, gap=(W-2*pad)/n;
    const max=Math.max(...datos.map(d=>d.valor))*1.15||1;
    let bars='';
    datos.forEach((d,i)=>{
      const x=pad+i*gap+(gap-bw)/2;
      const bh=(d.valor/max)*(H-2*pad);
      const y=H-pad-bh;
      bars+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="#1f5f9b"></rect>'+
            '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="11" fill="#13294b" font-weight="700">'+d.valor+'</text>'+
            '<text x="'+(x+bw/2)+'" y="'+(H-pad+18)+'" text-anchor="middle" font-size="10.5" fill="#6b7688">'+mesLabel(d.nombre)+'</text>';
    });
    return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><text x="'+pad+'" y="22" font-size="12" fill="#13294b" font-weight="700">Leads nuevos por mes (últimos 12)</text>'+bars+'</svg>';
  }
})();
</script>
<script src="assets/widget.js?v=2"></script>
</body>
</html>
